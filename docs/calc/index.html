<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Calculator — Rogue Shard Wiki</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="calc.css">
</head>
<body>

<nav class="crumbs">
  <a href="../index.html" data-t="wiki">Rogue Shard Wiki</a><i>›</i><span data-t="title">Build Calculator</span>
  <span class="lang" id="lang">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
  </span>
</nav>

<div class="calc">

  <section class="log-wrap">
    <div class="log-head" data-t="log">Log</div>
    <ol class="log" id="log"></ol>
  </section>

  <aside class="hero" id="hero">
    <div class="hero-pick">
      <select id="character"></select>
    </div>

    <div class="hero-card">
      <img class="hero-face" id="face" alt="">
      <div class="hero-id">
        <div class="hero-name" id="heroName"></div>
        <div class="hero-class" id="heroClass"></div>
        <div class="hero-level"><span data-t="level">Level</span> <b id="level">1</b></div>
      </div>
    </div>

    <div class="points">
      <div class="point" id="pointSkill"><span data-t="skillPoints">Skill points</span><b>0</b></div>
      <div class="point" id="pointAttr"><span data-t="attrPoints">Attribute points</span><b>0</b></div>
    </div>

    <ul class="attrs" id="attrs"></ul>

    <div class="trophies" id="trophies"></div>

    <div class="controls">
      <button id="levelUp" class="primary" data-t="levelUp">Level up</button>
      <button id="undo" title="Ctrl+Z" data-t="undo">Undo</button>
      <button id="reset" data-t="reset">Reset</button>
    </div>

    <div class="controls">
      <button id="share" data-t="share">Copy build link</button>
    </div>
    <div class="share-note" id="shareNote" hidden></div>

    <label class="check"><input type="checkbox" id="formulaMode"> <span data-t="formulas">Show formulas instead of numbers</span></label>

  </aside>

  <main class="trees">
    <div class="tree-add">
      <select id="addBranch"><option value="">+ add a skill tree…</option></select>
    </div>
    <div class="tree-grid" id="treeGrid"></div>
  </main>

</div>

<div class="tip" id="tip" hidden></div>

<script src="data.js"></script>
<script src="calc.js"></script>
</body>
</html>
